<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$lutWalk Denver - Community Hub</title>
    <meta name="description" content="Community hub for $lutWalk Denver organizing, education, events, zines, and mutual aid resources." />
    <style>
      :root {
        color-scheme: dark;
        --pink: #ff2d95;
        --hot-pink: #ff4fb4;
        --purple: #7d2cff;
        --black: #111111;
        --white: #ffffff;
        --muted: #e0d5c7;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #1b151b 0%, #120f13 100%);
        color: #f5efe8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        max-width: 600px;
        width: 100%;
      }

      h1 {
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-weight: 800;
        font-size: 2.5rem;
        margin: 0 0 0.75rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .subtitle {
        color: var(--muted);
        margin: 0 0 2rem;
      }

      input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 248, 240, 0.2);
        background: rgba(255, 248, 240, 0.05);
        color: var(--white);
        font-size: 1rem;
        outline: none;
      }

      .btn-row {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      .notice {
        margin-top: 2rem;
        padding: 1rem;
        border: 1px solid rgba(255, 248, 240, 0.16);
        border-radius: 8px;
        background: rgba(255, 248, 240, 0.05);
      }

      .notice p {
        margin: 0;
        font-size: 0.95rem;
      }

      .message {
        margin-top: 1rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .error {
        color: #ff8ab4;
      }

      .success {
        color: #b3ffae;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #ff2d95, #ff70d3, #7d2cff);
        color: var(--white);
        font-weight: 700;
        border-radius: 100px;
        transition: transform 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>$lutWalk Denver</h1>
      <p class="subtitle">Member password entry for the community hub.</p>

      <form id="gateForm">
        <label for="password" class="sr-only">Member password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        />

        <div class="btn-row">
          <button type="submit" class="btn">Enter Community Hub</button>
          <a href="/" class="btn">Open App Root</a>
        </div>

        <p id="message" class="message">Enter your password to unlock the community hub.</p>
      </form>

      <div class="notice">
        <p>If this page is being served as a static fallback, the app root is still available at <strong>/</strong>.</p>
      </div>
    </div>

    <script>
      const form = document.getElementById('gateForm');
      const passwordInput = document.getElementById('password');
      const messageEl = document.getElementById('message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        messageEl.textContent = 'Checking password...';
        messageEl.className = 'message';

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ password: passwordInput.value }),
          });

          if (!response.ok) {
            messageEl.textContent = 'Incorrect password. Please try again.';
            messageEl.classList.add('error');
            return;
          }

          messageEl.textContent = 'Password accepted. Redirecting to the community hub...';
          messageEl.classList.add('success');
          window.location.href = '/';
        } catch (error) {
          messageEl.textContent = 'Unable to connect to the app. Please try again later.';
          messageEl.classList.add('error');
        }
      });
    </script>
  </body>
</html>
